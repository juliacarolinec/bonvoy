<header class="cabecalho">
  <a class="marca" routerLink="/">
    <span aria-hidden="true">✈︎</span>
    Bonvoy
  </a>

  <nav class="menu" aria-label="Menu principal">
    <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page">Home</a>

    <a routerLink="/pacotes" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page">Pacotes</a>

  </nav>

  @if (sessaoEquipe.logada()) {
  <a class="perfil" routerLink="/perfil">Meu perfil</a>
  } @else {
  <a class="perfil" routerLink="/login">Entrar</a>
  }
</header>
<router-outlet></router-outlet>
